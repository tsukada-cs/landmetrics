[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landmetrics"
dynamic = ["version"]
description = "Distance to land, land fraction within radius, and land/ocean tests from GSHHG coastlines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Taiga Tsukada" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "netCDF4>=1.6",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]
dev = ["landmetrics[test]", "ruff"]

[project.scripts]
landmetrics = "landmetrics.cli:main"

[project.urls]
Homepage = "https://github.com/tsukada-cs/landmetrics"
Issues = "https://github.com/tsukada-cs/landmetrics/issues"

[tool.hatch.version]
path = "src/landmetrics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/landmetrics"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/DATA_LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running or large-file tests, excluded by default",
    "network: tests that require network access",
]
addopts = "-m 'not slow'"
testpaths = ["tests"]
