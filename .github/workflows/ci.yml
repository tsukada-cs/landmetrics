name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -m "not slow" --cov=landmetrics --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: verify bundled grid data is in the wheel
        run: |
          python - <<'PY'
          import zipfile, glob
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "landmetrics/data/distance_to_land_0.1deg_gt0km2.nc",
              "landmetrics/data/land_fraction_0.1deg_gt0km2.nc",
          ]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          assert not missing, f"missing from wheel: {missing}"
          PY
      - name: install wheel into a clean venv and query with no repo on sys.path
        run: |
          python -m venv /tmp/landmetrics-clean-env
          /tmp/landmetrics-clean-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/landmetrics-clean-env/bin/python -c "
          import landmetrics as lm
          print(lm.distance_to_land(25.0, -80.0))
          print(lm.is_land(25.0, -80.0))
          print(lm.land_fraction(25.0, -80.0, 300.0))
          "
